# AR Diagnostic MVP - Configuration (Jetson Nano / JetPack 4.6.x)
# ⚠️  NÃO alterar use_4bit para true: bitsandbytes requer compute >= 7.5 (Nano = 5.3 Maxwell)
# ⚠️  NÃO trocar modelo para phi: Phi-3 Mini ~3.8B não cabe em 4GB VRAM sem quantização 4-bit
# ✅  use_int8: usa optimum-quanto (pure PyTorch, sem restrição de compute) — ~50% menos memória banda
#------------------------------------------------------------------------------------------------------------------------------------------------------------------------
models:
  default: qwen            # Único modelo viável no Jetson Nano (0.5B, ~1GB VRAM em fp16)
  device: cuda             # 'cuda', 'cpu', ou 'auto'
  use_4bit: false          # ⚠️  DESABILITADO: bitsandbytes não funciona no Jetson (compute 5.3 Maxwell)
  use_int8: true           # ✅  HABILITADO: quantização INT8 via optimum-quanto (compatível com Maxwell/compute 5.3)
  greedy_decoding: true    # ✅  Decoding guloso (do_sample=False): elimina overhead do top_p/sampling — maior ganho de velocidade single-token
  prompt_max_length: 256   # Comprimento máximo do prompt em tokens (prompts Jetson são pequenos; 256 evita alocação desnecessária)
  warmup_on_startup: true  # Fazer warm-up automático no startup (recomendado)
  
  qwen:
    name: Qwen/Qwen2.5-0.5B-Instruct
    max_tokens: 60          # ✅  Reduzido de 100→60: cada token não gerado é tempo poupado linearmente; 60 é suficiente para respostas AR úteis
    summary_tokens: 80      # ✅  Reduzido de 150→80: summary mais conciso e mais rápido para uso em mobile real-time
    temperature: 0.4        # Ignorado quando greedy_decoding=true
    top_p: 0.9              # Ignorado quando greedy_decoding=true
  
  phi:
    name: microsoft/Phi-3-mini-4k-instruct
    max_tokens: 120
    summary_tokens: 200
    temperature: 0.3
    top_p: 0.9

#------------------------------------------------------------------------------------------------------------------------------------------------------------------------
# Rule engine configuration
rule_engine: {}

#------------------------------------------------------------------------------------------------------------------------------------------------------------------------
# PDI analysis parameters
pdi:
  illumination:
    roi_enabled: false
    histogram_bins: 256
    analyze_clipping: true
    clipping_low: 10
    clipping_high: 245
    
    # Classification thresholds
    clipped_bright_overexposed: 0.10
    clipped_dark_underexposed: 0.10
    mean_underexposed: 70
    mean_overexposed: 185
    good: 0.7
    min_acceptable: 0.5

#------------------------------------------------------------------------------------------------------------------------------------------------------------------------
# Ambiente de execução
environment: jetson

#------------------------------------------------------------------------------------------------------------------------------------------------------------------------
# API Configuration
api:
  max_batch_size: 10
  max_image_size: 10485760      # 10MB
  allowed_formats:
    - jpg
    - jpeg
    - png
    - bmp
  timeout: 30

# Logging
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: logs/ar_diagnostic_mvp.log
