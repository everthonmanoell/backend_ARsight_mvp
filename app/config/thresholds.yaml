# AR Diagnostic MVP - Configuration (Environment-independent)
#------------------------------------------------------------------------------------------------------------------------------------------------------------------------
models:
  default: dialogpt-small             # Editar: qwen/phi (Jetson Orin/Desktop), dialogpt-small (Jetson Nano)
  device: cuda                        # cuda, cpu, ou auto
  use_4bit: false                     # false (Jetson Nano), true (Jetson Orin/Desktop com bitsandbytes)
  greedy_decoding: true               # true (Nano - velocidade), false (Orin/Desktop - qualidade)
  prompt_max_length: 128              # 256 tokens (Jetson Nano: velocidade + controle), 512 tokens (Jetson Orin/Desktop: melhor qualidade)
  warmup_on_startup: false            # true (acelera respostas iniciais), false (economiza recursos na inicialização)
  
  # qwen:
  #   # Qwen 2.5 - 0.5B: Rápido, qualidade média
  #   name: Qwen/Qwen2.5-0.5B-Instruct
  #   max_tokens: 100
  #   summary_tokens: 150
  #   temperature: 0.3
  #   top_p: 0.85

  # testar Qwen na Jetson Nano com essas configurações mais leves para avaliar desempenho e qualidade 
  # (mudar prompt_max_length: 128 para reduzir latência)
  qwen:
    name: /home/das9/models/Qwen2.5-0.5B-Instruct
    max_tokens: 20
    summary_tokens: 32
    temperature: 0.2
    top_p: 0.9
  
  phi:
    # Phi-3-mini: Qualidade superior, ~3.8B params
    # Jetson Orin: Sim (12GB VRAM). Jetson Nano: Não (4GB)
    name: microsoft/Phi-3-mini-4k-instruct
    max_tokens: 120
    summary_tokens: 200
    temperature: 0.3
    top_p: 0.85
  
  dialogpt-small:
    # Microsoft DialoGPT-small: Ultra-leve, 117M params
    # Compatível: PyTorch 1.10, transformers 4.8.2
    # VRAM estimada: ~250MB em FP16
    name: /home/das9/models/DialoGPT-small     # Local (evita download automático, necessário para Jetson Nano)
    # name: microsoft/DialoGPT-small     # HuggingFace Hub (auto-downloads)
    max_tokens: 40
    summary_tokens: 60
    temperature: 0.3
    top_p: 0.85

#------------------------------------------------------------------------------------------------------------------------------------------------------------------------
# Rule engine configuration
# A classificação de iluminação é feita pelo IlluminationAnalyzer (pdi.illumination)
# que considera clipping, luminância média e score de forma integrada
rule_engine: {}

#------------------------------------------------------------------------------------------------------------------------------------------------------------------------
# PDI analysis parameters
pdi:
  illumination:
    roi_enabled: false           # MVP não usa ROI
    histogram_bins: 256
    analyze_clipping: true
    clipping_low: 10             # Threshold para shadow clipping
    clipping_high: 245           # Threshold para highlight clipping
    
    # Classification thresholds
    clipped_bright_overexposed: 0.10    # % de pixels clipped bright para classificar como overexposed
    clipped_dark_underexposed: 0.10     # % de pixels clipped dark para classificar como underexposed
    mean_underexposed: 70               # Luminância média abaixo desse valor é underexposed
    mean_overexposed: 185               # Luminância média acima desse valor é overexposed
    good: 0.7                           # Score >= 0.7 é "adequate"
    min_acceptable: 0.5                 # Score >= 0.5 é "acceptable"

#------------------------------------------------------------------------------------------------------------------------------------------------------------------------
# Ambiente de execução — detecta automaticamente ou use variável de ambiente AR_ENVIRONMENT
# Deixe vazio para detecção automática por hostname/GPU
# Opções: 'jetson-nano', 'jetson-orin', 'desktop-legion', 'desktop-rtx' (ou vazio para auto)
environment: auto

#------------------------------------------------------------------------------------------------------------------------------------------------------------------------
# API Configuration
api:
  max_batch_size: 10
  max_image_size: 10485760      # 10MB
  allowed_formats:
    - jpg
    - jpeg
    - png
    - bmp
  timeout: 30                    # segundos

# Logging
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: logs/ar_diagnostic_mvp.log