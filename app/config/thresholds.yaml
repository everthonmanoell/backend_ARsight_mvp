# AR Diagnostic MVP - Configuration
# Illumination-only pipeline for Jetson deployment

models:
  default: qwen  # Modelo padrão: 'qwen' ou 'phi'
  device: cuda   # 'cuda', 'cpu', ou 'auto'
  use_4bit: true # Quantização 4-bit (recomendado para Jetson)
  
  qwen:
    name: Qwen/Qwen2.5-0.5B-Instruct
    max_tokens: 100
    temperature: 0.3  # Baixo para reduzir alucinações
    top_p: 0.85
  
  phi:
    name: microsoft/Phi-3-mini-4k-instruct
    max_tokens: 120
    temperature: 0.4
    top_p: 0.85

# Rule engine thresholds (illumination only)
rule_engine:
  illumination:
    underexposed_threshold: 0.35  # Abaixo disso = underexposed
    overexposed_threshold: 0.75   # Acima disso = overexposed
    min_brightness: 0.2           # Mínimo absoluto
    max_brightness: 0.9           # Máximo aceitável
    clipping_threshold: 0.15      # % de pixels clipped

# PDI analysis parameters
pdi:
  illumination:
    roi_enabled: false           # MVP não usa ROI
    histogram_bins: 256
    analyze_clipping: true
    clipping_low: 10             # Threshold para shadow clipping
    clipping_high: 245           # Threshold para highlight clipping

# API Configuration
api:
  max_batch_size: 10
  max_image_size: 10485760      # 10MB
  allowed_formats:
    - jpg
    - jpeg
    - png
    - bmp
  timeout: 30                    # segundos

# Logging
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: logs/ar_diagnostic_mvp.log
