# AR Diagnostic MVP - Configuration
# Illumination-only pipeline for Jetson deployment
#------------------------------------------------------------------------------------------------------------------------------------------------------------------------
models:
  default: qwen            # Legion: Qwen 0.5B default (mais rápido); trocar para 'phi' para maior qualidade
  device: cuda             # 'cuda', 'cpu', ou 'auto'
  use_4bit: true           # Legion: 4-bit com bitsandbytes (compute >= 7.5 OK no Legion)
  use_int8: false          # Legion: não usar optimum-quanto (bitsandbytes 4-bit já é superior aqui)
  greedy_decoding: false   # Legion: manter sampling com temperature/top_p para variedade nas respostas
  prompt_max_length: 512   # Legion: 512 tokens (GPU tem memória abundante, sem necessidade de cortar)
  warmup_on_startup: true  # Fazer warm-up automático no startup (recomendado)
  
  qwen:
    name: Qwen/Qwen2.5-0.5B-Instruct
    max_tokens: 100         # BASELINE EXACT (achieved 6.39s)
    summary_tokens: 150
    temperature: 0.3
    top_p: 0.85
  
  phi:
    name: microsoft/Phi-3-mini-4k-instruct
    max_tokens: 120         # BASELINE EXACT
    summary_tokens: 200
    temperature: 0.3
    top_p: 0.85

#------------------------------------------------------------------------------------------------------------------------------------------------------------------------
# Rule engine configuration
# A classificação de iluminação é feita pelo IlluminationAnalyzer (pdi.illumination)
# que considera clipping, luminância média e score de forma integrada
rule_engine: {}

#------------------------------------------------------------------------------------------------------------------------------------------------------------------------
# PDI analysis parameters
pdi:
  illumination:
    roi_enabled: false           # MVP não usa ROI
    histogram_bins: 256
    analyze_clipping: true
    clipping_low: 10             # Threshold para shadow clipping
    clipping_high: 245           # Threshold para highlight clipping
    
    # Classification thresholds
    clipped_bright_overexposed: 0.10    # % de pixels clipped bright para classificar como overexposed
    clipped_dark_underexposed: 0.10     # % de pixels clipped dark para classificar como underexposed
    mean_underexposed: 70               # Luminância média abaixo desse valor é underexposed
    mean_overexposed: 185               # Luminância média acima desse valor é overexposed
    good: 0.7                           # Score >= 0.7 é "adequate"
    min_acceptable: 0.5                 # Score >= 0.5 é "acceptable"

#------------------------------------------------------------------------------------------------------------------------------------------------------------------------
# Ambiente de execução — define subdiretório de saída dos resultados JSON
# 'jetson' -> outputs/jetson/   'legion' -> outputs/legion/
environment: legion

#------------------------------------------------------------------------------------------------------------------------------------------------------------------------
# API Configuration
api:
  max_batch_size: 10
  max_image_size: 10485760      # 10MB
  allowed_formats:
    - jpg
    - jpeg
    - png
    - bmp
  timeout: 30                    # segundos

# Logging
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: logs/ar_diagnostic_mvp.log
