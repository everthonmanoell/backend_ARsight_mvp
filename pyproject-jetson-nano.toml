[tool.poetry]
name = "ar-diagnostic-mvp"
version = "0.1.0"
description = "AR Scene Illumination Diagnostic MVP - Jetson Nano (L4T R32.7)"
authors = ["TCC Team <tcc@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
# Jetson Nano: L4T R32.7.x, JetPack 4.6, Python 3.6
python = "^3.6"

# API stack - versões compatíveis com Python 3.6
fastapi = "~0.83.0"
uvicorn = { extras = ["standard"], version = "~0.17.0" }
python-multipart = "~0.0.5"
starlette = "~0.19.1"
pydantic = "~1.9"

# Core
pyyaml = "~6.0"
numpy = "~1.21.6"
scipy = "~1.7.3"

# Vision - aarch64 wheels disponíveis
opencv-python-headless = "~4.5.5"

# LLM (torch/torchvision instalados via setup_jetson_nano.sh)
transformers = "~4.18.0"
huggingface-hub = "~0.4.0"

# Utilities
python-json-logger = "~2.0.7"
python-dotenv = "~0.19.0"
requests = "~2.27.1"
click = "~8.0.4"

[tool.poetry.dev-dependencies]
pytest = "^5.4"  # Última versão que suporta Python 3.6
pytest-asyncio = "^0.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
