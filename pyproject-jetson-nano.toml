# -------------------------------------------------------------------------------------------------------------
# pyproject-jetson-nano.toml — Jetson Nano native configuration
#
# Environment: Jetson Nano
# L4T: R32.7.x
# JetPack: 4.6.x
# CUDA: 10.2
# Python: 3.6.9
#
# Notes:
# This configuration targets native execution on Jetson Nano without Docker.
# Dependency versions are intentionally conservative because Python 3.6 and
# JetPack 4.6 require older compatible packages.
# -------------------------------------------------------------------------------------------------------------

[tool.poetry]
name = "ar-diagnostic-mvp"
version = "0.1.0"
description = "AR Scene Illumination Diagnostic MVP - Jetson Nano Native"
authors = ["Daniela Amorim de Sá <daniela.amorimdesa@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
# Jetson Nano native stack: L4T R32.7.x, JetPack 4.6.x, Python 3.6.9.
python = ">=3.6.2,<3.7"

# API stack compatible with Python 3.6.
fastapi = "~0.83.0"
uvicorn = "~0.16.0"
python-multipart = "~0.0.5"
pydantic = "~1.9"

# Core utilities.
pyyaml = "~5.4.1"
numpy = "~1.19.5"
pillow = "~6.2.2"
matplotlib = "~3.3.4"

# LLM utilities.
# These versions are kept conservative for Python 3.6 compatibility.
transformers = "~4.18.0"
huggingface-hub = "~0.4.0"

# Logging and miscellaneous utilities.
python-json-logger = "~2.0.7"
python-dotenv = "~0.19.0"
requests = "~2.27.1"
click = "~7.1.2"

[tool.poetry.dev-dependencies]
pytest = "^5.4"
pytest-asyncio = "^0.12.0"

[tool.poetry.scripts]
ar-api = "app.api.main:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"