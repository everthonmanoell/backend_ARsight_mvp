[tool.poetry]
name = "ar-diagnostic-mvp"
version = "0.1.0"
description = "AR Scene Illumination Diagnostic MVP - Jetson Nano (L4T R32.7)"
authors = ["Daniela Amorim de Sá <daniela.amorimdesa@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
# Jetson Nano: L4T R32.7.x, JetPack 4.6, Python 3.6.9
# Desktop: Python 3.10.x
python = ">=3.6.2,<4.0"

# API stack - compatível com Python 3.6
fastapi = "~0.83.0"
uvicorn = "~0.16.0"
python-multipart = "~0.0.5"
pydantic = "~1.9"

# Core
pyyaml = "~5.4.1"
numpy = "~1.19.5"
pillow = "~6.2.2"

# LLM / utilidades
transformers = "~4.18.0"
huggingface-hub = "~0.4.0"

# Logging / misc
python-json-logger = "~2.0.7"
python-dotenv = "~0.19.0"
requests = "~2.27.1"
click = "~7.1.2"

[tool.poetry.group.dev.dependencies]
pytest = "^5.4"
pytest-asyncio = "^0.12.0"

[tool.poetry.scripts]
ar-api = "app.api.main:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"