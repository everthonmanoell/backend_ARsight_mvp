version: '3.8'

services:
  ar-diagnostic-mvp-nano:
    build:
      context: .
      dockerfile: docker/Dockerfile.jetson-nano
    container_name: ar-diagnostic-mvp-nano
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models/cache:/app/models/cache
      - ./outputs:/app/outputs
    environment:
      - TRANSFORMERS_CACHE=/app/models/cache
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Edite thresholds.yaml antes de build: default: tiny-llama ou gemma-2b
      # Se necessário override: -e AR_CONFIG_FILE=/app/app/config/thresholds.yaml
    # JetPack 4.6.x (L4T R32.7.x) com nvidia-container-runtime
    runtime: nvidia
    restart: unless-stopped
    # Limits para Jetson Nano (4GB compartilhada)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
