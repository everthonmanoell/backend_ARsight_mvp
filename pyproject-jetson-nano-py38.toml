[tool.poetry]
name = "ar-diagnostic-mvp"
version = "0.1.0"
description = "AR Scene Illumination Diagnostic MVP - Jetson Nano (L4T R32.7) - Python 3.8 Stack"
authors = ["Daniela Amorim de Sá <daniela.amorimdesa@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
# Jetson Nano: L4T R32.7.x, JetPack 4.6, Python 3.8 (instalado manualmente)
# PyTorch 1.11.0 ou 1.12.0 (ARM64 wheels disponíveis)
python = "^3.8,<3.9"

# API stack - compatível com Python 3.8
fastapi = "~0.104.0"
uvicorn = { version = "~0.24.0", extras = ["standard"] }
python-multipart = "~0.0.6"
pydantic = "~2.4.0"

# Core
pyyaml = "~6.0"
numpy = "~1.24.0"  # 1.24 é último a suportar Python 3.8
pillow = "~10.0.0"  # 10.x suporta Python 3.8, 11.x requer 3.9+
opencv-python-headless = "~4.8.0"

# LLM - PyTorch + Transformers para Qwen
# NOTA: PyTorch wheel ARM64 deve ser instalado fora do Poetry (ver setup.sh)
transformers = "~4.30.0"  # Compatível com Python 3.8 + PyTorch 1.11
huggingface-hub = "~0.14.0"
accelerate = "~0.27.0"

# Logging / misc
python-json-logger = "~2.0.7"
python-dotenv = "~1.0.0"
requests = "~2.31.0"
click = "~8.1.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
pytest-asyncio = "^0.21.0"

[tool.poetry.scripts]
ar-api = "app.api.main:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
