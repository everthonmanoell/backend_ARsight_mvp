version: '3.8'

services:
  ar-diagnostic-mvp:
    build:
      context: .
      dockerfile: docker/Dockerfile.jetson
    container_name: ar-diagnostic-mvp
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models/cache:/app/models/cache
    environment:
      - TRANSFORMERS_CACHE=/app/models/cache
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
