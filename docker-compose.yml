version: '3.8'

services:
  ar-diagnostic-mvp:
    build:
      context: .
      dockerfile: docker/Dockerfile.jetson
    container_name: ar-diagnostic-mvp
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models/cache:/app/models/cache
    environment:
      - TRANSFORMERS_CACHE=/app/models/cache
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - AR_CONFIG_FILE=/app/app/config/thresholds.jetson.yaml # injeta config Jetson automaticamente
    # JetPack 4.6.x (L4T R32.7.x) usa nvidia-container-runtime
    # "runtime: nvidia" é a forma correta para JetPack 4.6 / Docker < 19.03
    runtime: nvidia
    restart: unless-stopped
